<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지도 기반 자판기 재고 확인 앱</title>
  
  <!-- Leaflet OpenStreetMap CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-color: #f7f4ee;
      --card-bg: #ffffff;
      --primary-color: #d97706;
      --primary-hover: #b45309;
      --text-color: #44403c;
      --border-color: #e7e5e4;
      --accent-blue: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 800px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      color: var(--primary-color);
    }

    .info-text {
      font-size: 0.9rem;
      text-align: center;
      color: #78716c;
      line-height: 1.4;
    }

    #map {
      width: 100%;
      height: 400px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      z-index: 1;
    }

    .result-container {
      padding: 20px;
      border-radius: 12px;
      background-color: #fafaf9;
      border: 1px solid var(--border-color);
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .result-container.active {
      display: flex;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
    }

    .vending-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary-color);
    }

    .refresh-btn {
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary-color);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s;
    }

    .refresh-btn:hover {
      background-color: var(--primary-hover);
    }

    .refresh-btn:disabled {
      background-color: #a8a29e;
      cursor: not-allowed;
    }

    .loading-text {
      color: #78716c;
      font-style: italic;
      text-align: center;
      padding: 12px 0;
    }

    .stock-content {
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .error {
      color: #dc2626;
      font-weight: 500;
    }

    /* 내 위치 마커 */
    .user-location-marker {
      background-color: var(--accent-blue);
      border: 2px solid white;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.6);
    }

    /* 자판기 커스텀 마커 */
    .vending-icon {
      background-color: #ffffff;
      border: 2px solid var(--primary-color);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📍 지도 기반 자판기 재고 확인 앱</h1>
    <p class="info-text">
      지도를 축소(줌아웃)하거나 이동해도 자판기 위치는 실제 장소에 고정됩니다.<br/>
      자판기 마커(🥤)를 클릭하여 실시간 예상 재고를 확인해보세요!
    </p>
    
    <!-- 지도 영역 -->
    <div id="map"></div>

    <!-- 결과 영역 -->
    <div id="result" class="result-container">
      <div class="result-header">
        <span id="vendingTitle" class="vending-title">자판기 재고 정보</span>
        <button id="refreshBtn" class="refresh-btn">🔄 재고 새로고침</button>
      </div>
      <div id="stockContent" class="stock-content"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    const resultDiv = document.getElementById('result');
    const vendingTitle = document.getElementById('vendingTitle');
    const stockContent = document.getElementById('stockContent');
    const refreshBtn = document.getElementById('refreshBtn');

    let currentSelectedVending = null;

    // 기본 위치 (서울역)
    let userLat = 37.5547;
    let userLng = 126.9707;

    const map = L.map('map').setView([userLat, userLng], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const vendingIcon = L.divIcon({
      className: 'vending-icon',
      html: '🥤',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    // 📍 주요 지역별 실제 고정 위치 데이터를 등록하는 함수
    function registerFixedVendingMachines(centerLat, centerLng) {
      // 위치 좌표가 절대 고정된 자판기 데이터베이스 (예시 데이터)
      const fixedVendingDatabase = [
        // 서울역 주변 고정 자판기
        { id: 101, name: "서울역 1번출구 자판기 (음료/스낵)", lat: 37.5555, lng: 126.9710 },
        { id: 102, name: "서울역 버스환승센터 자판기", lat: 37.5538, lng: 126.9725 },
        { id: 103, name: "남산백범광장 자판기 (멀티)", lat: 37.5542, lng: 126.9780 },
        
        // 강남역 주변 고정 자판기
        { id: 201, name: "강남역 11번출구 자판기", lat: 37.4981, lng: 127.0276 },
        { id: 202, name: "강남 CGV 앞 자판기", lat: 37.5015, lng: 127.0263 },

        // 홍대입구 주변 고정 자판기
        { id: 301, name: "홍대입구역 9번출구 자판기", lat: 37.5568, lng: 126.9238 },
        { id: 302, name: "홍대 걷고싶은거리 자판기", lat: 37.5552, lng: 126.9220 },

        // 사용자 현재 위치 기반 근처 고정 위치 2개 생성 (최초 1회만 고정 등록)
        { id: 901, name: "내 근처 자판기 A호점", lat: centerLat + 0.002, lng: centerLng + 0.002 },
        { id: 902, name: "내 근처 자판기 B호점", lat: centerLat - 0.0015, lng: centerLng + 0.003 }
      ];

      // 고정 마커 생성 (지도 축소/이동을 해도 이동하지 않고 절대 좌표에 고정됨)
      fixedVendingDatabase.forEach(vm => {
        const marker = L.marker([vm.lat, vm.lng], { icon: vendingIcon }).addTo(map);
        marker.bindPopup(`<b>${vm.name}</b><br/><small>클릭하여 재고 확인</small>`);

        marker.on('click', () => {
          currentSelectedVending = vm;
          checkStock(vm);
        });
      });
    }

    function initApp(lat, lng) {
      map.setView([lat, lng], 15);

      // 내 위치 마커 (파란색)
      const userIcon = L.divIcon({
        className: 'user-location-marker',
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });
      L.marker([lat, lng], { icon: userIcon })
        .addTo(map)
        .bindPopup('<b>현재 내 위치</b>')
        .openPopup();

      // 고정 자판기 지도에 등록
      registerFixedVendingMachines(lat, lng);
    }

    // 위치 정보 수신
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          userLat = position.coords.latitude;
          userLng = position.coords.longitude;
          initApp(userLat, userLng);
        },
        (error) => {
          initApp(userLat, userLng);
        }
      );
    } else {
      initApp(userLat, userLng);
    }

    async function checkStock(vending) {
      resultDiv.classList.add('active');
      vendingTitle.textContent = `🥤 ${vending.name}`;
      stockContent.className = 'stock-content loading-text';
      stockContent.textContent = 'Gemini 3.1 Lite AI가 실시간 예상 재고를 확인 중입니다...';
      refreshBtn.disabled = true;

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ 
            vendingName: vending.name,
            lat: vending.lat,
            lng: vending.lng
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '오류가 발생했습니다.');
        }

        stockContent.className = 'stock-content';
        stockContent.innerHTML = data.result;
      } catch (error) {
        stockContent.className = 'stock-content error';
        stockContent.textContent = `오류 발생: ${error.message}`;
      } finally {
        refreshBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener('click', () => {
      if (currentSelectedVending) {
        checkStock(currentSelectedVending);
      }
    });
  </script>
</body>
</html>
