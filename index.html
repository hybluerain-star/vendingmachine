<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전국 지도 기반 자판기 재고 확인 앱</title>
  
  <!-- Leaflet OpenStreetMap CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-color: #f7f4ee;
      --card-bg: #ffffff;
      --primary-color: #d97706;
      --primary-hover: #b45309;
      --text-color: #44403c;
      --border-color: #e7e5e4;
      --accent-blue: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 850px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      color: var(--primary-color);
    }

    .info-text {
      font-size: 0.9rem;
      text-align: center;
      color: #78716c;
      line-height: 1.4;
    }

    .city-nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 4px;
    }

    .city-btn {
      padding: 6px 12px;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
      background: #f5f5f4;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .city-btn:hover {
      background-color: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    #map {
      width: 100%;
      height: 450px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      z-index: 1;
    }

    .result-container {
      padding: 20px;
      border-radius: 12px;
      background-color: #fafaf9;
      border: 1px solid var(--border-color);
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .result-container.active {
      display: flex;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
    }

    .vending-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary-color);
    }

    .refresh-btn {
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary-color);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .refresh-btn:disabled {
      background-color: #a8a29e;
      cursor: not-allowed;
    }

    .loading-text {
      color: #78716c;
      font-style: italic;
      text-align: center;
      padding: 12px 0;
    }

    .stock-content {
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .user-location-marker {
      background-color: var(--accent-blue);
      border: 2px solid white;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.6);
    }

    .vending-icon {
      background-color: #ffffff;
      border: 2px solid var(--primary-color);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📍 전국 자판기 지도 & 실시간 AI 재고 확인</h1>
    <p class="info-text">
      성남, 서울, 부산 등 전국 각지의 실제 고정 위치 자판기 마커(🥤)입니다.<br/>
      원하는 도시를 클릭하여 이동해보세요!
    </p>

    <!-- 빠른 도시 이동 버튼 -->
    <div class="city-nav">
      <button class="city-btn" onclick="moveToCity(37.4449, 127.1388, '성남(모란/야탑)')">📍 성남</button>
      <button class="city-btn" onclick="moveToCity(37.5547, 126.9707, '서울역')">📍 서울</button>
      <button class="city-btn" onclick="moveToCity(35.1796, 129.0756, '부산')">📍 부산</button>
      <button class="city-btn" onclick="moveToCity(35.8714, 128.6014, '대구')">📍 대구</button>
      <button class="city-btn" onclick="moveToCity(37.4563, 126.7052, '인천')">📍 인천</button>
      <button class="city-btn" onclick="moveToCity(35.1595, 126.8526, '광주')">📍 광주</button>
      <button class="city-btn" onclick="moveToCity(36.3504, 127.3845, '대전')">📍 대전</button>
      <button class="city-btn" onclick="moveToCity(35.5384, 129.3114, '울산')">📍 울산</button>
      <button class="city-btn" onclick="moveToCity(33.4996, 126.5312, '제주')">📍 제주</button>
    </div>
    
    <!-- 지도 영역 -->
    <div id="map"></div>

    <!-- 결과 영역 -->
    <div id="result" class="result-container">
      <div class="result-header">
        <span id="vendingTitle" class="vending-title">자판기 재고 정보</span>
        <button id="refreshBtn" class="refresh-btn">🔄 재고 새로고침</button>
      </div>
      <div id="stockContent" class="stock-content"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    const resultDiv = document.getElementById('result');
    const vendingTitle = document.getElementById('vendingTitle');
    const stockContent = document.getElementById('stockContent');
    const refreshBtn = document.getElementById('refreshBtn');

    let currentSelectedVending = null;
    let map = L.map('map').setView([37.4449, 127.1388], 14); // 기본 성남시 모란역 근처

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const vendingIcon = L.divIcon({
      className: 'vending-icon',
      html: '🥤',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    // 📍 전국 주요 도시별 고정 자판기 좌표 데이터베이스
    const nationalVendingDatabase = [
      // 성남 / 경기
      { id: 1, name: "성남 모란역 8번출구 자판기", lat: 37.4323, lng: 127.1292 },
      { id: 2, name: "성남 야탑역 광장 자판기", lat: 37.4114, lng: 127.1287 },
      { id: 3, name: "판교테크노밸리 멀티 자판기", lat: 37.4021, lng: 127.1086 },
      { id: 4, name: "성남시청 민원실 앞 자판기", lat: 37.4200, lng: 127.1266 },
      { id: 5, name: "수원역 환승센터 자판기", lat: 37.2660, lng: 127.0007 },

      // 서울
      { id: 101, name: "서울역 1번출구 자판기", lat: 37.5555, lng: 126.9710 },
      { id: 102, name: "강남역 11번출구 자판기", lat: 37.4981, lng: 127.0276 },
      { id: 103, name: "홍대입구역 9번출구 자판기", lat: 37.5568, lng: 126.9238 },
      { id: 104, name: "여의도 한강공원 음료자판기", lat: 37.5284, lng: 126.9331 },

      // 부산
      { id: 201, name: "부산 서면역 지하상가 자판기", lat: 35.1578, lng: 129.0592 },
      { id: 202, name: "해운대 만남의광장 자판기", lat: 35.1587, lng: 129.1604 },

      // 대구
      { id: 301, name: "대구 동성로 야외 자판기", lat: 35.8694, lng: 128.5942 },

      // 인천
      { id: 401, name: "인천 부평역 광장 자판기", lat: 37.4895, lng: 126.7233 },

      // 광주
      { id: 501, name: "광주 유스퀘어 터미널 자판기", lat: 35.1602, lng: 126.8794 },

      // 대전
      { id: 601, name: "대전역 동광장 자판기", lat: 36.3315, lng: 127.4332 },

      // 제주
      { id: 701, name: "제주공항 게이트 앞 자판기", lat: 33.5066, lng: 126.4929 }
    ];

    // 전국 자판기 마커 일괄 배치
    function initNationalMarkers() {
      nationalVendingDatabase.forEach(vm => {
        const marker = L.marker([vm.lat, vm.lng], { icon: vendingIcon }).addTo(map);
        marker.bindPopup(`<b>${vm.name}</b><br/><small>클릭하여 재고 확인</small>`);

        marker.on('click', () => {
          currentSelectedVending = vm;
          checkStock(vm);
        });
      });
    }

    // 도시 이동 버튼 클릭 함수
    function moveToCity(lat, lng, cityName) {
      map.setView([lat, lng], 14);
    }

    // 내 위치 탐색
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((pos) => {
        const userLat = pos.coords.latitude;
        const userLng = pos.coords.longitude;
        map.setView([userLat, userLng], 14);

        const userIcon = L.divIcon({
          className: 'user-location-marker',
          iconSize: [18, 18],
          iconAnchor: [9, 9]
        });
        L.marker([userLat, userLng], { icon: userIcon }).addTo(map).bindPopup('<b>현재 내 위치</b>');
      });
    }

    initNationalMarkers();

    async function checkStock(vending) {
      resultDiv.classList.add('active');
      vendingTitle.textContent = `🥤 ${vending.name}`;
      stockContent.className = 'stock-content loading-text';
      stockContent.textContent = 'Gemini 3.1 Lite AI가 실시간 예상 재고를 확인 중입니다...';
      refreshBtn.disabled = true;

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            vendingName: vending.name,
            lat: vending.lat,
            lng: vending.lng
          }),
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '오류가 발생했습니다.');

        stockContent.className = 'stock-content';
        stockContent.innerHTML = data.result;
      } catch (error) {
        stockContent.className = 'stock-content error';
        stockContent.textContent = `오류 발생: ${error.message}`;
      } finally {
        refreshBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener('click', () => {
      if (currentSelectedVending) checkStock(currentSelectedVending);
    });
  </script>
</body>
</html>
