<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지도 기반 자판기 재고 확인 앱</title>
  
  <!-- Leaflet OpenStreetMap CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-color: #f7f4ee;
      --card-bg: #ffffff;
      --primary-color: #d97706;
      --primary-hover: #b45309;
      --text-color: #44403c;
      --border-color: #e7e5e4;
      --accent-blue: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 800px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      color: var(--primary-color);
    }

    .info-text {
      font-size: 0.9rem;
      text-align: center;
      color: #78716c;
      line-height: 1.4;
    }

    #map {
      width: 100%;
      height: 400px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      z-index: 1;
    }

    .result-container {
      padding: 20px;
      border-radius: 12px;
      background-color: #fafaf9;
      border: 1px solid var(--border-color);
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .result-container.active {
      display: flex;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
    }

    .vending-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary-color);
    }

    .refresh-btn {
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary-color);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s;
    }

    .refresh-btn:hover {
      background-color: var(--primary-hover);
    }

    .refresh-btn:disabled {
      background-color: #a8a29e;
      cursor: not-allowed;
    }

    .loading-text {
      color: #78716c;
      font-style: italic;
      text-align: center;
      padding: 12px 0;
    }

    .stock-content {
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .error {
      color: #dc2626;
      font-weight: 500;
    }

    /* 내 위치 마커 */
    .user-location-marker {
      background-color: var(--accent-blue);
      border: 2px solid white;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.6);
    }

    /* 자판기 커스텀 마커 스타일 */
    .vending-icon {
      background-color: #ffffff;
      border: 2px solid var(--primary-color);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📍 지도 기반 자판기 재고 확인 앱</h1>
    <p class="info-text">
      지도를 이동하면 새로운 지역 근처 자판기가 자동으로 탐색됩니다.<br/>
      자판기 마커(🥤)를 클릭하여 AI 실시간 예상 재고를 확인해보세요!
    </p>
    
    <!-- 지도 영역 -->
    <div id="map"></div>

    <!-- 결과 영역 -->
    <div id="result" class="result-container">
      <div class="result-header">
        <span id="vendingTitle" class="vending-title">자판기 재고 정보</span>
        <button id="refreshBtn" class="refresh-btn">🔄 재고 새로고침</button>
      </div>
      <div id="stockContent" class="stock-content"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    const resultDiv = document.getElementById('result');
    const vendingTitle = document.getElementById('vendingTitle');
    const stockContent = document.getElementById('stockContent');
    const refreshBtn = document.getElementById('refreshBtn');

    let currentSelectedVending = null;

    // 기본 위치 (서울역)
    let userLat = 37.5547;
    let userLng = 126.9707;

    // 지도 초기화
    const map = L.map('map').setView([userLat, userLng], 16);

    // OpenStreetMap 타일 레이어
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 자판기 마커들을 저장할 그룹
    const vendingMarkersGroup = L.layerGroup().addTo(map);

    // 자판기 커스텀 아이콘
    const vendingIcon = L.divIcon({
      className: 'vending-icon',
      html: '🥤',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    // 지도 중심 기준으로 근처 가상 자판기 마커 생성 함수
    function updateVendingMachinesOnMap() {
      vendingMarkersGroup.clearLayers();

      const center = map.getCenter();
      const zoom = map.getZoom();

      // 너무 멀리 줌아웃된 경우에는 자판기를 표시하지 않음 (줌 레벨 13 이상일 때만)
      if (zoom < 13) return;

      const offset = 0.002 * (16 / Math.max(zoom, 10));

      const vendingMachines = [
        { id: 1, name: "자판기 A호점 (음료/스낵)", lat: center.lat + offset, lng: center.lng + offset },
        { id: 2, name: "자판기 B호점 (스낵 전용)", lat: center.lat - offset * 0.8, lng: center.lng + offset * 1.2 },
        { id: 3, name: "자판기 C호점 (멀티 자판기)", lat: center.lat + offset * 0.6, lng: center.lng - offset * 1.1 },
        { id: 4, name: "자판기 D호점 (음료 전용)", lat: center.lat - offset * 1.1, lng: center.lng - offset * 0.7 }
      ];

      vendingMachines.forEach(vm => {
        const marker = L.marker([vm.lat, vm.lng], { icon: vendingIcon });
        marker.bindPopup(`<b>${vm.name}</b><br/><small>클릭하여 재고 확인</small>`);

        marker.on('click', () => {
          currentSelectedVending = vm;
          checkStock(vm);
        });

        vendingMarkersGroup.addLayer(marker);
      });
    }

    // 초기 앱 설정
    function initApp(lat, lng) {
      map.setView([lat, lng], 16);

      // 내 위치 마커
      const userIcon = L.divIcon({
        className: 'user-location-marker',
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });
      L.marker([lat, lng], { icon: userIcon })
        .addTo(map)
        .bindPopup('<b>현재 내 위치</b>')
        .openPopup();

      // 초기 자판기 탐색
      updateVendingMachinesOnMap();
    }

    // 지도 이동/줌 종료 시 그 지역 근처 자판기 자동 생성
    map.on('moveend', () => {
      updateVendingMachinesOnMap();
    });

    // GPS 위치 요청
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          userLat = position.coords.latitude;
          userLng = position.coords.longitude;
          initApp(userLat, userLng);
        },
        (error) => {
          initApp(userLat, userLng);
        }
      );
    } else {
      initApp(userLat, userLng);
    }

    // AI 재고 확인 요청 함수
    async function checkStock(vending) {
      resultDiv.classList.add('active');
      vendingTitle.textContent = `🥤 ${vending.name}`;
      stockContent.className = 'stock-content loading-text';
      stockContent.textContent = 'Gemini AI가 실시간 예상 재고를 확인 중입니다...';
      refreshBtn.disabled = true;

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ 
            vendingName: vending.name,
            lat: vending.lat,
            lng: vending.lng
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '오류가 발생했습니다.');
        }

        stockContent.className = 'stock-content';
        stockContent.innerHTML = data.result;
      } catch (error) {
        stockContent.className = 'stock-content error';
        stockContent.textContent = `오류 발생: ${error.message}`;
      } finally {
        refreshBtn.disabled = false;
      }
    }

    // 새로고침 버튼 이벤트
    refreshBtn.addEventListener('click', () => {
      if (currentSelectedVending) {
        checkStock(currentSelectedVending);
      }
    });
  </script>
</body>
</html>
