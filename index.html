<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>픽앤뽑 (Pick & Pop) 전국 자판기 지도 & AI 재고 안내</title>
  
  <!-- Leaflet OpenStreetMap CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      /* 심플 & 깔끔한 하늘색 중심 테마 */
      --bg-color: #f0f9ff;            /* 맑은 하늘빛 배경 (Sky-50) */
      --card-bg: #ffffff;            /* 깔끔한 흰색 카드 */
      --primary-color: #0284c7;       /* 메인 포카리/스카이 블루 (Sky-600) */
      --primary-hover: #0369a1;       /* 호버 시 짙은 블루 (Sky-700) */
      --accent-cyan: #06b6d4;         /* 밝은 시안 포인트 (Cyan-500) */
      --accent-cyan-bg: #e0f2fe;      /* 소프트 하늘색 배경 */
      --text-main: #0f172a;           /* 모던 딥 블루/슬레이트 텍스트 */
      --text-sub: #64748b;            /* 부드러운 설명 텍스트 */
      --border-color: #e2e8f0;        /* 은은한 회색 테두리 */
      --card-border: #bae6fd;          /* 은은한 하늘색 카드 테두리 */
      --shadow-sm: 0 4px 12px rgba(2, 132, 199, 0.08);
      --shadow-md: 0 10px 25px -5px rgba(2, 132, 199, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 12px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 850px;
      padding: 28px;
      border-radius: 20px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .header-group {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--primary-color);
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .info-text {
      font-size: 0.92rem;
      color: var(--text-sub);
      line-height: 1.5;
    }

    /* 도시 추천 버튼 라인 */
    .city-nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px;
    }

    .city-btn {
      padding: 7px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid var(--border-color);
      background-color: #f8fafc;
      color: var(--text-main);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .city-btn:hover {
      background-color: var(--accent-cyan-bg);
      color: var(--primary-color);
      border-color: #7dd3fc;
      transform: translateY(-1px);
    }

    /* 지도 창 */
    #map {
      width: 100%;
      height: 440px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      z-index: 1;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }

    /* 결과 서랍 창 */
    .result-container {
      padding: 22px;
      border-radius: 14px;
      background-color: #f0f9ff;
      border: 1px solid #bae6fd;
      display: none;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow-sm);
    }

    .result-container.active {
      display: flex;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e0f2fe;
      padding-bottom: 12px;
    }

    .vending-title {
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--primary-color);
    }

    .refresh-btn {
      padding: 8px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary-color);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .refresh-btn:hover {
      background-color: var(--primary-hover);
    }

    .refresh-btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .loading-text {
      color: var(--text-sub);
      font-style: italic;
      text-align: center;
      padding: 16px 0;
    }

    .stock-content {
      line-height: 1.6;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    /* 내 위치 마커 */
    .user-location-marker {
      background-color: var(--accent-cyan);
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.6);
    }

    /* 자판기 커스텀 마커 */
    .vending-icon {
      background-color: #ffffff;
      border: 2.5px solid var(--primary-color);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .vending-icon:hover {
      transform: scale(1.15);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-group">
      <h1>🧃 픽앤뽑 (Pick & Pop) 자판기 지도</h1>
      <p class="info-text">
        전국에 위치한 <b>픽앤뽑 자판기</b> 위치입니다.<br/>
        도시를 선택하거나 지도 아이콘(🥤)을 클릭하여 AI 실시간 재고 상태를 확인해보세요!
      </p>
    </div>

    <!-- 빠른 도시 이동 버튼 -->
    <div class="city-nav">
      <button class="city-btn" onclick="moveToCity(37.4449, 127.1388)">📍 성남</button>
      <button class="city-btn" onclick="moveToCity(37.5547, 126.9707)">📍 서울</button>
      <button class="city-btn" onclick="moveToCity(35.1796, 129.0756)">📍 부산</button>
      <button class="city-btn" onclick="moveToCity(35.8714, 128.6014)">📍 대구</button>
      <button class="city-btn" onclick="moveToCity(37.4563, 126.7052)">📍 인천</button>
      <button class="city-btn" onclick="moveToCity(35.1595, 126.8526)">📍 광주</button>
      <button class="city-btn" onclick="moveToCity(36.3504, 127.3845)">📍 대전</button>
      <button class="city-btn" onclick="moveToCity(35.5384, 129.3114)">📍 울산</button>
      <button class="city-btn" onclick="moveToCity(33.4996, 126.5312)">📍 제주</button>
    </div>
    
    <!-- 지도 영역 -->
    <div id="map"></div>

    <!-- 결과 영역 -->
    <div id="result" class="result-container">
      <div class="result-header">
        <span id="vendingTitle" class="vending-title">자판기 재고 정보</span>
        <button id="refreshBtn" class="refresh-btn">🔄 재고 새로고침</button>
      </div>
      <div id="stockContent" class="stock-content"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    const resultDiv = document.getElementById('result');
    const vendingTitle = document.getElementById('vendingTitle');
    const stockContent = document.getElementById('stockContent');
    const refreshBtn = document.getElementById('refreshBtn');

    let currentSelectedVending = null;
    let map = L.map('map').setView([37.4449, 127.1388], 14); // 기본 성남시 모란역 근처

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const vendingIcon = L.divIcon({
      className: 'vending-icon',
      html: '🥤',
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    // 📍 전국 픽앤뽑 자판기 좌표 데이터베이스
    const nationalVendingDatabase = [
      // 성남 / 경기
      { id: 1, name: "픽앤뽑 성남 모란역점", lat: 37.4323, lng: 127.1292 },
      { id: 2, name: "픽앤뽑 성남 야탑광장점", lat: 37.4114, lng: 127.1287 },
      { id: 3, name: "픽앤뽑 판교 테크노밸리점", lat: 37.4021, lng: 127.1086 },
      { id: 4, name: "픽앤뽑 성남시청점", lat: 37.4200, lng: 127.1266 },
      { id: 5, name: "픽앤뽑 수원역 환승센터점", lat: 37.2660, lng: 127.0007 },

      // 서울
      { id: 101, name: "픽앤뽑 서울역점", lat: 37.5555, lng: 126.9710 },
      { id: 102, name: "픽앤뽑 강남역점", lat: 37.4981, lng: 127.0276 },
      { id: 103, name: "픽앤뽑 홍대입구점", lat: 37.5568, lng: 126.9238 },
      { id: 104, name: "픽앤뽑 여의도 한강공원점", lat: 37.5284, lng: 126.9331 },

      // 부산
      { id: 201, name: "픽앤뽑 부산 서면점", lat: 35.1578, lng: 129.0592 },
      { id: 202, name: "픽앤뽑 해운대점", lat: 35.1587, lng: 129.1604 },

      // 대구
      { id: 301, name: "픽앤뽑 대구 동성로점", lat: 35.8694, lng: 128.5942 },

      // 인천
      { id: 401, name: "픽앤뽑 인천 부평역점", lat: 37.4895, lng: 126.7233 },

      // 광주
      { id: 501, name: "픽앤뽑 광주 유스퀘어점", lat: 35.1602, lng: 126.8794 },

      // 대전
      { id: 601, name: "픽앤뽑 대전역점", lat: 36.3315, lng: 127.4332 },

      // 제주
      { id: 701, name: "픽앤뽑 제주공항점", lat: 33.5066, lng: 126.4929 }
    ];

    function initNationalMarkers() {
      nationalVendingDatabase.forEach(vm => {
        const marker = L.marker([vm.lat, vm.lng], { icon: vendingIcon }).addTo(map);
        marker.bindPopup(`<b>${vm.name}</b><br/><small style="color:#0284c7;">클릭하여 재고 확인</small>`);

        marker.on('click', () => {
          currentSelectedVending = vm;
          checkStock(vm);
        });
      });
    }

    function moveToCity(lat, lng) {
      map.setView([lat, lng], 14);
    }

    // 사용자 현재 위치 확인
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((pos) => {
        const userLat = pos.coords.latitude;
        const userLng = pos.coords.longitude;
        map.setView([userLat, userLng], 14);

        const userIcon = L.divIcon({
          className: 'user-location-marker',
          iconSize: [18, 18],
          iconAnchor: [9, 9]
        });
        L.marker([userLat, userLng], { icon: userIcon }).addTo(map).bindPopup('<b>현재 내 위치</b>');
      });
    }

    initNationalMarkers();

    async function checkStock(vending) {
      resultDiv.classList.add('active');
      vendingTitle.textContent = `🧃 ${vending.name}`;
      stockContent.className = 'stock-content loading-text';
      stockContent.textContent = 'Gemini 3.1 Lite AI가 실시간 가상 재고를 확인 중입니다...';
      refreshBtn.disabled = true;

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            vendingName: vending.name,
            lat: vending.lat,
            lng: vending.lng
          }),
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '오류가 발생했습니다.');

        stockContent.className = 'stock-content';
        stockContent.innerHTML = data.result;
      } catch (error) {
        stockContent.className = 'stock-content error';
        stockContent.textContent = `오류 발생: ${error.message}`;
      } finally {
        refreshBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener('click', () => {
      if (currentSelectedVending) checkStock(currentSelectedVending);
    });
  </script>
</body>
</html>
