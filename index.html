<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>픽앤뽑 (Pick & Pop) 전국 자판기 지도 & AI 재고 안내</title>
  
  <!-- Leaflet OpenStreetMap CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      /* 하늘색 시원한 스카이 테마 */
      --bg-color: #f0f9ff;
      --card-bg: #ffffff;
      --primary-color: #0284c7;
      --primary-hover: #0369a1;
      --accent-cyan: #06b6d4;
      --accent-cyan-bg: #e0f2fe;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --card-border: #bae6fd;
      --shadow-sm: 0 4px 12px rgba(2, 132, 199, 0.08);
      --shadow-md: 0 10px 25px -5px rgba(2, 132, 199, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 12px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 850px;
      padding: 28px;
      border-radius: 20px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .header-group {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--primary-color);
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .info-text {
      font-size: 0.92rem;
      color: var(--text-sub);
      line-height: 1.5;
    }

    .data-badge {
      display: inline-block;
      padding: 4px 12px;
      background-color: #e0f2fe;
      color: #0369a1;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 4px;
    }

    .city-nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px;
    }

    .city-btn {
      padding: 7px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid var(--border-color);
      background-color: #f8fafc;
      color: var(--text-main);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .city-btn:hover {
      background-color: var(--accent-cyan-bg);
      color: var(--primary-color);
      border-color: #7dd3fc;
      transform: translateY(-1px);
    }

    #map {
      width: 100%;
      height: 440px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      z-index: 1;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }

    .result-container {
      padding: 22px;
      border-radius: 14px;
      background-color: #f0f9ff;
      border: 1px solid #bae6fd;
      display: none;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow-sm);
    }

    .result-container.active {
      display: flex;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e0f2fe;
      padding-bottom: 12px;
    }

    .vending-title {
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--primary-color);
    }

    .refresh-btn {
      padding: 8px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary-color);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .refresh-btn:hover {
      background-color: var(--primary-hover);
    }

    .refresh-btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .loading-text {
      color: var(--text-sub);
      font-style: italic;
      text-align: center;
      padding: 16px 0;
    }

    .stock-content {
      line-height: 1.6;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .user-location-marker {
      background-color: var(--accent-cyan);
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.6);
    }

    .vending-icon {
      background-color: #ffffff;
      border: 2.5px solid var(--primary-color);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .vending-icon:hover {
      transform: scale(1.15);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-group">
      <h1>🧃 픽앤뽑 (Pick & Pop) 자판기 지도</h1>
      <p class="info-text">
        행정안전부 공공데이터 연동 <b>전국 픽앤뽑 자판기</b> 위치입니다.<br/>
        마커(🥤)를 클릭하면 Gemini AI가 예상 실시간 재고를 안내해 드립니다.
      </p>
      <div><span id="dataStatusBadge" class="data-badge">🌐 데이터를 불러오는 중...</span></div>
    </div>

    <div class="city-nav">
      <button class="city-btn" onclick="moveToCity(37.4449, 127.1388)">📍 성남</button>
      <button class="city-btn" onclick="moveToCity(37.5547, 126.9707)">📍 서울</button>
      <button class="city-btn" onclick="moveToCity(35.1796, 129.0756)">📍 부산</button>
      <button class="city-btn" onclick="moveToCity(35.8714, 128.6014)">📍 대구</button>
      <button class="city-btn" onclick="moveToCity(37.4563, 126.7052)">📍 인천</button>
      <button class="city-btn" onclick="moveToCity(35.1595, 126.8526)">📍 광주</button>
      <button class="city-btn" onclick="moveToCity(36.3504, 127.3845)">📍 대전</button>
      <button class="city-btn" onclick="moveToCity(35.5384, 129.3114)">📍 울산</button>
      <button class="city-btn" onclick="moveToCity(33.4996, 126.5312)">📍 제주</button>
    </div>
    
    <div id="map"></div>

    <div id="result" class="result-container">
      <div class="result-header">
        <span id="vendingTitle" class="vending-title">자판기 재고 정보</span>
        <button id="refreshBtn" class="refresh-btn">🔄 재고 새로고침</button>
      </div>
      <div id="stockContent" class="stock-content"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    const resultDiv = document.getElementById('result');
    const vendingTitle = document.getElementById('vendingTitle');
    const stockContent = document.getElementById('stockContent');
    const refreshBtn = document.getElementById('refreshBtn');
    const dataStatusBadge = document.getElementById('dataStatusBadge');

    let currentSelectedVending = null;
    let map = L.map('map').setView([37.4449, 127.1388], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const vendingIcon = L.divIcon({
      className: 'vending-icon',
      html: '🥤',
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    async function loadVendingMachines() {
      try {
        const response = await fetch('/api/vending-list');
        const result = await response.json();

        if (result.source === 'api') {
          dataStatusBadge.textContent = '🏛️ 행정안전부 공공데이터 실시간 연동됨';
          dataStatusBadge.style.backgroundColor = '#dcfce7';
          dataStatusBadge.style.color = '#15803d';
        } else {
          dataStatusBadge.textContent = '💡 공공데이터 API 키 대기 중 (기본 샘플 모드)';
          dataStatusBadge.style.backgroundColor = '#e0f2fe';
          dataStatusBadge.style.color = '#0369a1';
        }

        const vendingList = result.data || [];
        renderMarkers(vendingList);
      } catch (error) {
        console.error("데이터 로딩 실패:", error);
        dataStatusBadge.textContent = '⚠️ 데이터 로딩 실패 (기본 모드 전환)';
      }
    }

    function renderMarkers(list) {
      list.forEach(vm => {
        const marker = L.marker([vm.lat, vm.lng], { icon: vendingIcon }).addTo(map);
        marker.bindPopup(`<b>${vm.name}</b><br/><small style="color:#64748b;">${vm.address || '주소 정보 없음'}</small><br/><small style="color:#0284c7;">클릭하여 AI 재고 확인</small>`);

        marker.on('click', () => {
          currentSelectedVending = vm;
          checkStock(vm);
        });
      });
    }

    function moveToCity(lat, lng) {
      map.setView([lat, lng], 14);
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((pos) => {
        const userLat = pos.coords.latitude;
        const userLng = pos.coords.longitude;
        map.setView([userLat, userLng], 14);

        const userIcon = L.divIcon({
          className: 'user-location-marker',
          iconSize: [18, 18],
          iconAnchor: [9, 9]
        });
        L.marker([userLat, userLng], { icon: userIcon }).addTo(map).bindPopup('<b>현재 내 위치</b>');
      });
    }

    loadVendingMachines();

    async function checkStock(vending) {
      resultDiv.classList.add('active');
      vendingTitle.textContent = `🧃 ${vending.name}`;
      stockContent.className = 'stock-content loading-text';
      stockContent.textContent = 'Gemini 3.1 Flash-Lite AI가 실시간 예상 재고를 확인 중입니다...';
      refreshBtn.disabled = true;

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            vendingName: vending.name,
            lat: vending.lat,
            lng: vending.lng
          }),
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '오류가 발생했습니다.');

        stockContent.className = 'stock-content';
        stockContent.innerHTML = data.result;
      } catch (error) {
        stockContent.className = 'stock-content error';
        stockContent.textContent = `오류 발생: ${error.message}`;
      } finally {
        refreshBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener('click', () => {
      if (currentSelectedVending) checkStock(currentSelectedVending);
    });
  </script>
</body>
</html>
